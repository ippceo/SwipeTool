name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 创建 GitHub Release 需要写入 contents 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          # ubuntu-latest runner 已预装 Android SDK，直接用其 sdkmanager，
          # 避免 android-actions/setup-android 与新版 cmdline-tools 的 'tools' 兼容问题。
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 组织密钥：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
          B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KEYPASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')
          if [ -n "$B64" ]; then
            printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" >/dev/null 2>&1; then
              echo "签名密钥校验失败（KEYSTORE_PASSWORD 不对，或 keystore 损坏）。"
              exit 1
            fi
            # KEY_PASSWORD 用于解 alias 的私钥；若未配置或与当前 keystore 不匹配，
            # 回退到 KEYSTORE_PASSWORD（多数 keystore 的 key 密码与 store 密码相同）。
            echo "alias 条目：$(keytool -list -alias "$ALIAS" -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" 2>/dev/null | head -n 1)"
            KEYPASS_OK=0
            for CAND in "$KEYPASS" "$PASS"; do
              [ -n "$CAND" ] || continue
              if ERR=$(keytool -certreq -alias "$ALIAS" -keystore "$RUNNER_TEMP/release.jks" \
                  -storepass "$PASS" -keypass "$CAND" 2>&1 >/dev/null); then
                KEYPASS="$CAND"
                KEYPASS_OK=1
                break
              else
                echo "key 密码尝试失败：$ERR"
              fi
            done
            if [ "$KEYPASS_OK" != "1" ]; then
              echo "签名密钥校验失败：KEY_PASSWORD 与 KEYSTORE_PASSWORD 都无法解开该 alias 的私钥。"
              exit 1
            fi
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$PASS"
              echo "KEY_ALIAS=$ALIAS"
              echo "KEY_PASSWORD=$KEYPASS"
            } >> "$GITHUB_ENV"
            echo "签名密钥校验通过。"
          else
            echo "未配置签名密钥，release 将回退 debug 签名（版本间签名会不一致）。"
          fi

      - name: Build APKs (debug + release)
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs with version
        run: |
          # 仅标签构建取标签版本（v1.6.1 -> 1.6.1）；分支构建回退到 build.gradle 的 versionName
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\(.*\)".*/\1/p' app/build.gradle | head -n1)"
          fi
          [ -n "$VERSION" ] || { echo "无法获取版本号"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SwipeTool-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/SwipeTool-${VERSION}.apk"
          ls -l dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeTool-${{ env.VERSION }}-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeTool-${{ env.VERSION }}-release-apk
          path: dist/SwipeTool-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/SwipeTool-${{ env.VERSION }}.apk
          generate_release_notes: true
