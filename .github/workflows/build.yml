name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 创建 GitHub Release 需要写入 contents 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          # ubuntu-latest runner 已预装 Android SDK，直接用其 sdkmanager，
          # 避免 android-actions/setup-android 与新版 cmdline-tools 的 'tools' 兼容问题。
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Decode signing keystore
        env:
          KEYSTORE_BLOB: ${{ secrets.KEYSTORE_BLOB }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          # 优先使用合并密钥 KEYSTORE_BLOB：格式为 password|alias|base64(单行)
          if [ -n "$KEYSTORE_BLOB" ]; then
            PASS="${KEYSTORE_BLOB%%|*}"
            REST="${KEYSTORE_BLOB#*|}"
            ALIAS="${REST%%|*}"
            B64="${REST#*|}"
            echo "使用 KEYSTORE_BLOB 合并密钥。"
          else
            B64="$KEYSTORE_BASE64"
            PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS_SECRET"
            echo "使用分离的 Secret。"
          fi
          PASS=$(printf '%s' "$PASS" | tr -d '[:space:]')
          ALIAS=$(printf '%s' "$ALIAS" | tr -d '[:space:]')
          B64=$(printf '%s' "$B64" | tr -d '[:space:]')
          if [ -n "$B64" ]; then
            printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$PASS"
              echo "KEY_ALIAS=$ALIAS"
              echo "KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            echo "decoded size: $(wc -c < "$RUNNER_TEMP/release.jks") (expect 2638)"
            echo "decoded sha256: $(sha256sum "$RUNNER_TEMP/release.jks" | awk '{print $1}')"
            echo "expect sha256: c9bea98b768c4d624052bbbf3e76c4252c56d0eb77fe4a6c2abd35b385e7fbf3"
            echo "password length: ${#PASS} (expect 20)"
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" >/dev/null 2>&1; then
              echo "keystore password OK"
            else
              echo "keystore password FAILED (密码不对，或 keystore 文件损坏/被截断)"
            fi
          else
            echo "未配置签名密钥，release 将回退 debug 签名（版本间签名会不一致）。"
          fi

      - name: Build APKs (debug + release)
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeTool-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeTool-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
