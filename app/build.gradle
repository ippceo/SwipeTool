plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.walkandlook'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.walkandlook"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "1.9.0"
    }

    signingConfigs {
        // 固定签名：仅当通过环境变量提供 keystore 时启用（CI 用 GitHub Secrets 注入）。
        // 这样每次构建用同一把密钥，版本之间签名一致，可直接覆盖升级。
        if (System.getenv("KEYSTORE_FILE")) {
            release {
                // 统一 trim，避免 Secret 值带尾随空格 / 换行导致「密码不正确」
                storeFile file(System.getenv("KEYSTORE_FILE").trim())
                storePassword System.getenv("KEYSTORE_PASSWORD").trim()
                keyAlias System.getenv("KEY_ALIAS").trim()
                keyPassword System.getenv("KEY_PASSWORD").trim()
            }
        }
    }

    buildTypes {
        release {
            // R8 混淆 + 资源压缩，减小 release APK 体积。
            minifyEnabled true
            shrinkResources true
            // 有固定 keystore 用它签名（保证版本间签名一致、可覆盖升级）；
            // 否则回退 debug 签名，方便本地无密钥构建。
            signingConfig System.getenv("KEYSTORE_FILE")
                    ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
}
