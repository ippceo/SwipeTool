plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.swipetool'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.swipetool"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.5.1"
    }

    buildFeatures {
        aidl true
    }

    signingConfigs {
        // 固定签名：仅当通过环境变量提供 keystore 时启用（CI 用 GitHub Secrets 注入）。
        // 这样每次构建用同一把密钥，版本之间签名一致，可直接覆盖升级。
        if (System.getenv("KEYSTORE_FILE")) {
            release {
                // 统一 trim，避免 Secret 值带尾随空格 / 换行导致「密码不正确」
                storeFile file(System.getenv("KEYSTORE_FILE").trim())
                storePassword System.getenv("KEYSTORE_PASSWORD").trim()
                keyAlias System.getenv("KEY_ALIAS").trim()
                keyPassword System.getenv("KEY_PASSWORD").trim()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有固定 keystore 用它签名（保证版本间签名一致、可覆盖升级）；
            // 否则回退 debug 签名，方便本地无密钥构建。
            signingConfig System.getenv("KEYSTORE_FILE")
                    ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Shizuku 的 provider 需要引用系统权限 INTERACT_ACROSS_USERS_FULL，
        // 关闭 release 的 lint 阻断，避免误判导致构建失败。
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Shizuku：可选的执行方式，通过 shell(ADB) 权限运行 input swipe
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
