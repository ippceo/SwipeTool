plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.swipetool'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.swipetool"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            // 复用 AGP 自动生成的 debug keystore 为 release 签名，个人安装即可用。
            // 若要正式发布到应用商店，请替换为自己的 keystore 并通过 GitHub Secrets 注入。
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Shizuku 的 provider 需要引用系统权限 INTERACT_ACROSS_USERS_FULL，
        // 关闭 release 的 lint 阻断，避免误判导致构建失败。
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Shizuku：可选的执行方式，通过 shell(ADB) 权限运行 input swipe
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
